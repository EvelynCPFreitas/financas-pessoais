<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Remove totalmente qualquer barra de rolagem */
            background-color: #f1f5f9;
        }

        .main-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative;
            overflow: hidden;
        }

        /* --- Barra Lateral (Sidebar) --- */
        .sidebar {
            width: 250px;
            background: linear-gradient(to bottom, #a855f7, #4f46e5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: absolute;
            height: 100vh;
            left: 0;
            top: 0;
            transform: translateX(-250px);
            transition: transform 0.3s ease;
            z-index: 10;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .menu-items {
            display: flex;
            flex-direction: column;
            gap: 30px;
            padding-left: 40px;
        }

        .menu-items a {
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            color: #333333;
            cursor: pointer;
            transition: color 0.3s;
        }

        .menu-items a:hover, .menu-items a.active {
            color: white;
        }

        .toggle-sidebar-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            z-index: 20;
        }

        .sidebar .toggle-sidebar-btn {
            left: auto;
            right: 15px;
            color: white;
        }

        /* --- Área Principal --- */
        .content {
            flex: 1;
            width: 100%;
            height: 100vh;
            position: relative;
            padding: 30px 40px;
            overflow: hidden;
        }

        .screen {
            display: none;
            height: 100%;
            width: 100%;
            position: relative;
        }

        .screen.active {
            display: block;
        }

        /* TELA FINANÇAS */
        #tela-financas {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #tela-financas h1 {
            font-size: 5rem;
            font-weight: 900;
            color: #333333;
            margin: 0;
        }

        /* TELA CASA */
        #tela-casa h1 {
            font-size: 3.5rem;
            font-weight: 900;
            color: #333333;
            margin: 0 0 15px 0;
        }

        #tela-casa h2 {
            font-size: 1.3rem;
            color: #555;
            margin-top: 15px;
            margin-bottom: 10px;
            font-weight: normal;
        }

        .input-field {
            display: block;
            width: 330px;
            padding: 8px 12px;
            margin-bottom: 12px;
            border: 1px solid #555;
            border-radius: 20px;
            background-color: transparent;
            font-size: 0.95rem;
            color: #333;
        }

        .top-fields {
            position: absolute;
            top: 30px;
            right: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .top-fields .input-field {
            width: 260px;
        }

        .action-button {
            position: absolute;
            bottom: 30px;
            right: 0;
            width: 140px;
            height: 70px;
            border: 2px solid #333;
            border-radius: 20px;
            background-color: transparent;
            font-size: 1.1rem;
            color: #333;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .back-btn {
            position: absolute;
            bottom: 30px;
            left: 0;
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <button class="toggle-sidebar-btn" id="openSidebarBtn" onclick="toggleSidebar()">></button>

        <nav class="sidebar" id="sidebar">
            <button class="toggle-sidebar-btn" onclick="toggleSidebar()">&lt;</button>
            <div class="menu-items">
                <a onclick="mudarTela('casa')" id="menu-casa">CASA</a>
                <a onclick="mudarTela('casamento')" id="menu-casamento">CASAMENTO</a>
                <a onclick="mudarTela('viagem')" id="menu-viagem">VIAGEM</a>
                <a onclick="mudarTela('financas')" id="menu-financas">FINANÇAS</a>
            </div>
        </nav>

        <main class="content">
            
            <!-- TELA FINANÇAS -->
            <div id="tela-financas" class="screen active">
                <h1>FINANÇAS</h1>
            </div>

            <!-- TELA CASA -->
            <div id="tela-casa" class="screen">
                <h1>CASA</h1>
                
                <div class="top-fields">
                    <input type="text" id="casa-saldo" class="input-field" placeholder="Saldo Atual : R$ 0,00" readonly>
                    <input type="text" id="casa-objetivo" class="input-field" placeholder="Objetivo : R$ 0,00" readonly>
                    <input type="number" id="casa-add-saldo" class="input-field" placeholder="Adicionar valor ao saldo atual : R$" oninput="adicionarSaldo()">
                </div>

                <h2>ADICIONAR:</h2>
                <input type="text" id="casa-lugar" class="input-field" placeholder="Lugar">
                <input type="number" id="casa-valor" class="input-field" placeholder="Valor: R$" oninput="calcularObjetivo()">
                <input type="text" id="casa-item" class="input-field" placeholder="Espaço para escrever o que é">

                <button class="action-button" onclick="verMais()">Ver<br>mais</button>

                <button class="back-btn" onclick="mudarTela('financas')">←</button>
            </div>

            <!-- TELA CASAMENTO -->
            <div id="tela-casamento" class="screen">
                <h1>CASAMENTO</h1>
                <button class="back-btn" onclick="mudarTela('financas')">←</button>
            </div>

            <!-- TELA VIAGEM -->
            <div id="tela-viagem" class="screen">
                <h1>VIAGEM</h1>
                <button class="back-btn" onclick="mudarTela('financas')">←</button>
            </div>

        </main>

    </div>

    <script>
        let saldoAtual = 0;
        let objetivoTotal = 0;

        function mudarTela(nomeTela) {
            const telas = document.querySelectorAll('.screen');
            telas.forEach(tela => tela.classList.remove('active'));

            document.getElementById('tela-' + nomeTela).classList.add('active');

            if(nomeTela === 'financas') {
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('openSidebarBtn').style.display = 'block';
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const openBtn = document.getElementById('openSidebarBtn');
            
            sidebar.classList.toggle('open');
            
            if (sidebar.classList.contains('open')) {
                openBtn.style.display = 'none';
            } else {
                openBtn.style.display = 'block';
            }
        }

        function calcularObjetivo() {
            const valorInput = parseFloat(document.getElementById('casa-valor').value) || 0;
            objetivoTotal = valorInput;
            document.getElementById('casa-objetivo').value = `Objetivo : R$ ${objetivoTotal.toFixed(2)}`;
        }

        function adicionarSaldo() {
            const addValor = parseFloat(document.getElementById('casa-add-saldo').value) || 0;
            saldoAtual = addValor;
            document.getElementById('casa-saldo').value = `Saldo Atual : R$ ${saldoAtual.toFixed(2)}`;
        }

        function verMais() {
            alert("Redirecionando para a listagem completa dos itens...");
        }
    </script>
</body>
</html>
