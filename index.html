<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100vh;
            width: 100vw;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background-color: #f1f5f9;
        }

        .main-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative;
            overflow: hidden;
        }

        /* --- Barra Lateral (Sidebar) --- */
        .sidebar {
            width: 250px;
            background: linear-gradient(to bottom, #a855f7, #4f46e5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            transform: translateX(-250px);
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .menu-items {
            display: flex;
            flex-direction: column;
            gap: 30px;
            padding-left: 40px;
        }

        .menu-items a {
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            color: #333333;
            cursor: pointer;
            transition: color 0.3s;
        }

        .menu-items a:hover {
            color: white;
        }

        .toggle-sidebar-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            z-index: 50;
        }

        .sidebar .toggle-sidebar-btn {
            left: auto;
            right: 15px;
            color: white;
        }

        /* --- Área Principal --- */
        .content {
            flex: 1;
            height: 100vh;
            width: 100vw;
            position: relative;
            overflow: hidden;
        }

        .screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            height: 100vh;
            width: 100vw;
            padding: 40px;
        }

        .screen.active {
            display: block;
        }

        /* TELA FINANÇAS */
        #tela-financas {
            display: none;
            justify-content: center;
            align-items: center;
        }

        #tela-financas.active {
            display: flex;
        }

        #tela-financas h1 {
            font-size: 5rem;
            font-weight: 900;
            color: #333333;
        }

        /* TELA CASA */
        #tela-casa h1 {
            font-size: 4rem;
            font-weight: 900;
            color: #333333;
            margin-bottom: 20px;
        }

        #tela-casa h2 {
            font-size: 1.5rem;
            color: #555;
            margin-top: 20px;
            margin-bottom: 15px;
            font-weight: normal;
        }

        .input-field {
            display: block;
            width: 350px;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #555;
            border-radius: 20px;
            background-color: transparent;
            font-size: 1rem;
            color: #333;
            outline: none;
        }

        /* Estilo específico para o campo select de lugar para manter o padrão */
        select.input-field {
            cursor: pointer;
        }

        .top-fields {
            position: absolute;
            top: 40px;
            right: 40px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .top-fields .input-field {
            width: 280px;
        }

        .action-button {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 150px;
            height: 80px;
            border: 2px solid #333;
            border-radius: 20px;
            background-color: transparent;
            font-size: 1.2rem;
            color: #333;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .back-btn {
            position: absolute;
            bottom: 40px;
            left: 40px;
            background: none;
            border: none;
            font-size: 2.5rem;
            cursor: pointer;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <button class="toggle-sidebar-btn" id="openSidebarBtn" onclick="toggleSidebar()">></button>

        <nav class="sidebar" id="sidebar">
            <button class="toggle-sidebar-btn" onclick="toggleSidebar()">&lt;</button>
            <div class="menu-items">
                <a onclick="mudarTela('casa')">CASA</a>
                <a onclick="mudarTela('casamento')">CASAMENTO</a>
                <a onclick="mudarTela('viagem')">VIAGEM</a>
                <a onclick="mudarTela('financas')">FINANÇAS</a>
            </div>
        </nav>

        <main class="content">
            
            <!-- TELA FINANÇAS -->
            <div id="tela-financas" class="screen active">
                <h1>FINANÇAS</h1>
            </div>

            <!-- TELA CASA -->
            <div id="tela-casa" class="screen">
                <h1>CASA</h1>
                
                <div class="top-fields">
                    <input type="text" id="casa-saldo" class="input-field" placeholder="Saldo Atual : R$ 0,00" readonly>
                    <input type="text" id="casa-objetivo" class="input-field" placeholder="Objetivo : R$ 0,00" readonly>
                    <input type="number" id="casa-add-saldo" class="input-field" placeholder="Adicionar valor ao saldo atual : R$" onkeydown="adicionarSaldoComEnter(event)">
                </div>

                <h2>ADICIONAR:</h2>
                <!-- Campo Lugar transformado em opções de seleção (Select) -->
                <select id="casa-lugar" class="input-field">
                    <option value="" disabled selected>Selecione o lugar</option>
                    <option value="SALA">SALA</option>
                    <option value="COZINHA">COZINHA</option>
                    <option value="SALA DE JANTAR">SALA DE JANTAR</option>
                    <option value="QUARTO">QUARTO</option>
                    <option value="BANHEIRO">BANHEIRO</option>
                    <option value="LAVANDERIA">LAVANDERIA</option>
                </select>

                <input type="number" id="casa-valor" class="input-field" placeholder="Valor: R$" oninput="calcularObjetivo()">
                <input type="text" id="casa-item" class="input-field" placeholder="Espaço para escrever o que é">

                <button class="action-button" onclick="verMais()">Ver<br>mais</button>

                <button class="back-btn" onclick="mudarTela('financas')">←</button>
            </div>

            <!-- TELA CASAMENTO -->
            <div id="tela-casamento" class="screen">
                <h1>CASAMENTO</h1>
                <button class="back-btn" onclick="mudarTela('financas')">←</button>
            </div>

            <!-- TELA VIAGEM -->
            <div id="tela-viagem" class="screen">
                <h1>VIAGEM</h1>
                <button class="back-btn" onclick="mudarTela('financas')">←</button>
            </div>

        </main>

    </div>

    <script>
        let saldoAtual = 0;
        let objetivoTotal = 0;

        function mudarTela(nomeTela) {
            const telas = document.querySelectorAll('.screen');
            telas.forEach(tela => tela.classList.remove('active'));

            document.getElementById('tela-' + nomeTela).classList.add('active');

            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('openSidebarBtn').style.display = 'block';
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const openBtn = document.getElementById('openSidebarBtn');
            
            sidebar.classList.toggle('open');
            
            if (sidebar.classList.contains('open')) {
                openBtn.style.display = 'none';
            } else {
                openBtn.style.display = 'block';
            }
        }

        function calcularObjetivo() {
            const valorInput = parseFloat(document.getElementById('casa-valor').value) || 0;
            objetivoTotal = valorInput;
            document.getElementById('casa-objetivo').value = `Objetivo : R$ ${objetivoTotal.toFixed(2)}`;
        }

        function adicionarSaldoComEnter(event) {
            if (event.key === 'Enter') {
                const inputElement = document.getElementById('casa-add-saldo');
                const addValor = parseFloat(inputElement.value) || 0;
                
                saldoAtual += addValor;
                
                document.getElementById('casa-saldo').value = `Saldo Atual : R$ ${saldoAtual.toFixed(2)}`;
                
                inputElement.value = '';
            }
        }

        function verMais() {
            alert("Redirecionando para a listagem completa dos itens...");
        }
    </script>
</body>
</html>
